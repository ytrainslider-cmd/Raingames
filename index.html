<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Arcade</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">Blue Arcade</div>
<div class="bar"><span id="coins" class="coins" hidden></span>
<button id="giftBtn" class="icon" title="Daily reward" aria-label="Daily reward" hidden>🎁</button>
<button id="searchBtn" class="icon" title="Search games" aria-label="Search games"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
<button id="plusBtn" class="icon plus" title="Create" aria-label="Create">+</button></div></header>
<main><h1>Play games made by everyone</h1><p class="sub">Build your own game or let AI do it, then publish it for the world.</p><div id="grid" class="grid"></div></main>
<div id="modal" class="overlay" hidden><div class="box"><button class="x" id="close" aria-label="Close">×</button><div id="content"></div></div></div>
<script src="app.js"></script></body></html>
